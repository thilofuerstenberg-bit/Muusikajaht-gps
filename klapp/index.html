<!doctype html><html lang="et"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klapp 💕</title><style>body{font:17px system-ui;background:#faf0fc;color:#32223c;margin:0}main{max-width:560px;margin:30px auto;padding:22px;background:white;border-radius:24px;box-shadow:0 8px 30px #56316a20}button,input{box-sizing:border-box;width:100%;padding:14px;margin:7px 0;border-radius:12px;font:inherit}button{background:#9b3bc3;color:white;border:0;cursor:pointer}button:disabled{opacity:.4}input{border:1px solid #ddd}h1{color:#852cae}small{color:#777}.choice{background:#f4e8fb;color:#35233b}.selected{background:#9b3bc3;color:white}.code{font-size:32px;letter-spacing:5px;text-align:center;font-weight:bold}#err{color:#b00020}progress{width:100%}</style><main id="app"></main><script>
const URL='https://xdnqnngenhwkzubcijud.supabase.co/rest/v1/rpc/',KEY='sb_publishable_zqk_oUhB8G3LI6DHYcildQ_4hsYkv95',Q=["Mulle meeldib varakult ärgata.","Ma naudin spontaanseid plaane.","Mulle meeldib reisida.","Ma eelistan merd mägedele.","Mulle meeldib tantsida.","Ma kuulan iga päev muusikat.","Mulle meeldivad õudusfilmid.","Mulle meeldib koos süüa teha.","Ma armastan vürtsikat toitu.","Mulle meeldib proovida uusi toite.","Ma naudin suuri seltskondi.","Vajan iga päev omaette aega.","Mulle meeldib palju rääkida.","Ma eelistan sõnumeid telefonikõnedele.","Ma olen romantiline.","Mulle meeldivad üllatused.","Ma armastan loomi.","Ma naudin looduses matkamist.","Ma olen pigem planeerija.","Mulle meeldib sportida.","Ma naudin lauamänge.","Mulle meeldib kodus filmiõhtuid teha.","Ma tahaksin elada välismaal.","Ma naudin pikki vestlusi."],A=['Ei meeldi üldse','Pigem ei meeldi','Ükskõik','Pigem meeldib','Väga meeldib'];let s=JSON.parse(localStorage.getItem('klapp-v2')||'null'),answers=[],idx=0,timer;
const el=document.getElementById('app');function render(h){el.innerHTML=h+'<p id="err"></p>'}function err(e){document.getElementById('err').textContent=e.message||e}function save(){localStorage.setItem('klapp-v2',JSON.stringify(s))}
async function rpc(name,data){const r=await fetch(URL+name,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.message||'Ühenduse viga');return j}
function home(){clearInterval(timer);s=null;localStorage.removeItem('klapp-v2');render('<h1>💕 Klapp</h1><p>Kui hästi teie maitsed sobivad? Vastake eraldi telefonides 24 küsimusele!</p><input id="name" maxlength="32" placeholder="Sinu nimi"><button onclick="create()">Loo mäng</button><input id="code" maxlength="6" placeholder="Sõbra kuuekohaline kood"><button onclick="join()">Liitu mänguga</button>')}
async function create(){try{let n=document.getElementById('name').value.trim();let d=await rpc('klapp_create',{p_name:n});s={...d,name:n};save();quiz()}catch(e){err(e)}}
async function join(){try{let n=document.getElementById('name').value.trim(),c=document.getElementById('code').value.trim().toUpperCase();let d=await rpc('klapp_join',{p_name:n,p_code:c});s={...d,name:n};save();quiz()}catch(e){err(e)}}
function quiz(){if(idx>=Q.length){submit();return}render('<h1>💕 Klapp</h1><p>Sinu kood: <b>'+s.code+'</b> (saada teisele mängijale)</p><small>'+s.name+' · küsimus '+(idx+1)+' / 24</small><progress value="'+idx+'" max="24"></progress><h2>'+Q[idx]+'</h2>'+A.map((a,i)=>'<button class="choice '+(answers[idx]===i+1?'selected':'')+'" onclick="choose('+(i+1)+')">'+a+'</button>').join('')+'<button onclick="next()" '+(!answers[idx]?'disabled':'')+'>Järgmine →</button>')}
function choose(v){answers[idx]=v;quiz()}function next(){idx++;quiz()}
async function submit(){try{render('<h2>Salvestan vastuseid…</h2>');await rpc('klapp_submit',{p_code:s.code,p_token:s.token,p_answers:answers});s.done=true;save();wait()}catch(e){err(e)}}
function wait(){render('<h1>💌 Vastused salvestatud!</h1><p>Ootame teist mängijat. Jaga talle koodi:</p><div class="code">'+s.code+'</div><button onclick="navigator.clipboard.writeText(s.code)">Kopeeri kood</button><p id="status">Kontrollin…</p><button onclick="check()">Värskenda</button>');check();clearInterval(timer);timer=setInterval(check,4000)}
async function check(){try{let d=await rpc('klapp_status',{p_code:s.code,p_token:s.token});if(d.ready){clearInterval(timer);result(d)}else document.getElementById('status').textContent=d.joined?'Teine mängija vastab veel…':'Ootame teise mängija liitumist…'}catch(e){err(e)}}
function result(d){let pct=Math.round(d.mine.reduce((t,v,i)=>t+4-Math.abs(v-d.other[i]),0)/96*100);let dif=Q.map((q,i)=>({q,a:d.mine[i],b:d.other[i],dif:Math.abs(d.mine[i]-d.other[i])}));render('<h1>💖 Teie klapp</h1><div class="code">'+pct+'%</div><p>'+s.name+' ja '+d.other_name+' — mänguline tulemus, mitte teaduslik hinnang.</p><h2>🤝 Sarnasused</h2>'+dif.filter(x=>x.dif===0).slice(0,5).map(x=>'<p>✓ '+x.q+'</p>').join('')+'<h2>💬 Suurimad erinevused</h2>'+dif.sort((a,b)=>b.dif-a.dif).slice(0,4).map(x=>'<p><b>'+x.q+'</b><br>'+s.name+': '+A[x.a-1]+'<br>'+d.other_name+': '+A[x.b-1]+'</p>').join('')+'<button onclick="home()">Uus mäng</button>')}
if(s?.done)wait();else if(s){render('<h1>Tere tagasi!</h1><p>Kood: '+s.code+'</p><button onclick="quiz()">Jätka</button><button onclick="home()">Uus mäng</button>')}else home();
</script></html>
