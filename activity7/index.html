<!doctype html><html lang="et"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Muusika-AKTIVITY 7</title><style>
:root{font-family:system-ui;background:#0e1730;color:white}body{margin:0;padding:18px;max-width:1150px;margin:auto}h1{font-size:clamp(24px,4vw,46px);margin:8px 0}p{color:#b8c8e8}button{cursor:pointer;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;background:#a6e3ff;color:#10203b}button:active{transform:scale(.97)}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.panel{background:#1d2c4d;border:1px solid #415575;border-radius:20px;padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.cell{background:#293f64;min-height:72px;border-radius:12px;padding:8px;display:flex;flex-direction:column;justify-content:space-between}.finish{background:#73613c}.pieces{display:flex;gap:3px;flex-wrap:wrap}.piece{border-radius:50%;width:23px;height:23px;text-align:center;color:#071326;font-weight:bold}.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.score{padding:14px;border:2px solid;border-radius:14px}.score b{font-size:24px;display:block}.prompt{font-size:clamp(30px,7vw,64px);font-weight:800;margin:25px 0}.small{font-size:13px;color:#b8c8e8}.active{outline:4px solid white}#clock{font-size:50px;font-weight:800}#status{font-size:13px;color:#b8c8e8}a{color:#a6e3ff}@media(max-width:600px){.grid{grid-template-columns:repeat(4,1fr)}.scores{grid-template-columns:repeat(2,1fr)}.cell{min-height:55px}}
</style><h1>🎲 MUUSIKA-AKTIVITY 7</h1><p id="mode"></p><div id="status">Ühendan…</div><div id="app"></div>
<script>
const url='https://xdnqnngenhwkzubcijud.supabase.co',key='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhkbnFubmdlbmh3a3p1YmNpanVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1MTY5NTYsImV4cCI6MjExMDA5Mjk1Nn0.RcW5HXYedpMjFOEbIzrnyppkV3xj7LJ26Lmtc8nP5Xg',room='palade-7-muusika-2026';
const phone=new URLSearchParams(location.search).get('mode')==='phone',colors=['#fb7185','#60a5fa','#4ade80','#fbbf24'],types=['Näita','Joonista','Seleta'];
const groups=[
['Keelpillid','viiul|vioola|tšello|kontrabass|harf|poogen|pizzicato|keelpillikvartett|viiuli häälestamine|keelpillide perekond'],
['Löökpillid','timpan|ksülofon|trummipulgad|taldrikud|tamburiin|triangel|marimba|suur trumm|väike trumm|löökpillirühm'],
['Puupuhkpillid','flööt|pikolo|klarnet|oboe|fagott|saksofon|huulik|pilliroog|flöödimängija|puupuhkpillide rühm'],
['Vaskpuhkpillid','trompet|tromboon|metsasarv|tuuba|ventiil|trombooni kuliss|vaskpuhkpillide rühm|trompeti fanfaar|puhkpilliorkester|puhkpilli huulik'],
['Muusikateooria','dirigent|taktimõõt|noodijoonestik|viiulivõti|forte|piano (vaikselt)|crescendo|tempo|paus|sümfooniaorkester']];
const deck=groups.flatMap(([g,s])=>s.split('|').map((w,i)=>[g,w,types[i%3]])).concat([
['Boonus','Nimeta kolm puupuhkpilli.','Küsimus'],['Boonus','Nimeta kolm vaskpuhkpilli.','Küsimus'],['Boonus','Milline vaskpuhkpill kasutab kulissi? (tromboon)','Küsimus'],['Boonus','Kas saksofon kuulub puu- või vaskpuhkpillide hulka? (puu)','Küsimus'],['Boonus','Milline keelpill on viiuli ja tšello vahel? (vioola)','Küsimus'],['Boonus','Kumb kõlab madalamalt: pikolo või tuuba? (tuuba)','Küsimus'],['Boonus','Mida teeb dirigent? (juhatab orkestrit)','Küsimus'],['Boonus','Mis on pizzicato? (keele näppimine)','Küsimus']]);
const initial=()=>({teams:[0,0,0,0],turn:0,card:-1,used:[],round:0,started:0,names:['Punased','Sinised','Rohelised','Kollased']});
let state=initial(),signature='',busy=false;const el=id=>document.getElementById(id);
async function api(method='GET',data){let r=await fetch(url+'/rest/v1/activity7_rooms?id=eq.'+room+'&select=state',{method,headers:{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json',Prefer:'return=representation'},body:data?JSON.stringify(data):undefined});if(!r.ok)throw Error(await r.text());return r.json()}
async function refresh(){if(busy)return;try{let rows=await api();if(rows.length){let s=JSON.stringify(rows[0].state);if(s!==signature){state=rows[0].state;signature=s;render()}}el('status').textContent='🟢 Ühendatud · sama mäng mõlemal ekraanil'}catch(e){el('status').textContent='🔴 Ühenduse viga: '+e.message}}
async function save(){busy=true;render();try{await api('PATCH',{state});signature=JSON.stringify(state);el('status').textContent='🟢 Salvestatud'}catch(e){el('status').textContent='🔴 Salvestamine ebaõnnestus: '+e.message}finally{busy=false}}
function select(i){state.turn=i;save()}function next(){let available=deck.map((_,i)=>i).filter(i=>!state.used.includes(i));if(!available.length){state.used=[];available=deck.map((_,i)=>i)}let i=available[Math.floor(Math.random()*available.length)];state.card=i;state.used.push(i);state.round++;state.started=0;save()}
function move(n){state.teams[state.turn]=Math.max(0,Math.min(24,state.teams[state.turn]+n));state.turn=(state.turn+1)%4;state.started=0;save()}
function start(){state.started=state.started?0:Date.now();save()}function reset(){if(confirm('Alustame uut mängu?')){state=initial();save()}}function rename(){let x=prompt('Võistkonna nimi',state.names[state.turn]);if(x&&x.trim()){state.names[state.turn]=x.trim().slice(0,20);save()}}
function render(){el('mode').textContent=phone?'📱 ÕPETAJA TELEFON · salajased ülesanded':'🖥️ KLASSI MÄNGULAUD';let c=deck[state.card];if(phone){el('app').innerHTML='<div class="panel"><h2>Vali võistkond</h2><div class="bar">'+state.names.map((n,i)=>'<button style="background:'+colors[i]+'" class="'+(state.turn===i?'active':'')+'" onclick="select('+i+')">'+n+'</button>').join('')+'</div><div class="bar"><button onclick="next()">🎲 Uus ülesanne</button><button onclick="rename()">✏️ Muuda nime</button></div><div class="small">'+(c?c[0]+' · '+c[2]:'Alustamiseks vajuta „Uus ülesanne”')+'</div><div class="prompt">'+(c?c[1]:'Valmis mängima!')+'</div><p>'+(c?(c[2]==='Näita'?'Näita liigutustega, rääkimata.':c[2]==='Joonista'?'Joonista ilma tähtede ja sõnadeta.':c[2]==='Seleta'?'Seleta sõna, seda ennast ütlemata.':'Vasta küsimusele.'):'')+'</p><div id="clock">60 s</div><div class="bar"><button onclick="start()">⏱️ Start / paus</button><button onclick="move(1)">✅ Õige +1</button><button onclick="move(2)">🌟 +2</button><button onclick="move(0)">❌ Ei õnnestunud</button></div><div class="small">Kasutatud '+state.used.length+'/'+deck.length+' · Käik '+state.round+'</div><div class="bar"><button onclick="reset()">↺ Uus mäng</button></div></div>'}else{el('app').innerHTML='<div class="panel"><div class="scores">'+state.names.map((n,i)=>'<div class="score" style="border-color:'+colors[i]+'">'+n+'<b>'+state.teams[i]+'/24</b>'+(state.turn===i?'🎯 Käik':'')+'</div>').join('')+'</div></div><div class="panel"><div class="grid">'+Array.from({length:24},(_,i)=>'<div class="cell '+(i===23?'finish':'')+'"><b>'+(i===23?'🏆':i+1)+'</b><span class="small">'+types[i%3]+'</span><div class="pieces">'+state.teams.map((p,j)=>p===i+1?'<span class="piece" style="background:'+colors[j]+'">'+(j+1)+'</span>':'').join('')+'</div></div>').join('')+'</div></div><div class="panel"><b>Praegu mängib: '+state.names[state.turn]+'</b> · '+(c?c[2]:'Valmis')+'<div id="clock">60 s</div><p>Ülesanne on nähtav ainult õpetaja telefonis.</p></div>'}clock()}
function clock(){let e=el('clock');if(e)e.textContent=(state.started?Math.max(0,60-Math.floor((Date.now()-state.started)/1000)):60)+' s'}
window.select=select;window.next=next;window.move=move;window.start=start;window.reset=reset;window.rename=rename;
render();refresh();setInterval(refresh,1200);setInterval(clock,250);
</script></html>
