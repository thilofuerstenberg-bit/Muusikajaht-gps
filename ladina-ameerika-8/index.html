<!doctype html><html lang="et"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ladina-Ameerika muusikalahing</title><style>body{margin:0;background:#101c31;color:white;font:18px system-ui}main{max-width:920px;margin:auto;padding:24px}h1{font-size:clamp(28px,5vw,54px)}h2{font-size:clamp(24px,4vw,38px)}button,a{display:inline-block;background:#1c91b8;color:white;border:0;border-radius:12px;padding:14px;margin:6px;font:inherit;cursor:pointer}a{background:#354c72}section{background:#213653;padding:24px;border-radius:20px;margin:20px 0}.answers button{display:block;width:100%;text-align:left;background:#344c6d}.hidden{display:none}.score{display:inline-block;padding:10px;background:#344c6d;border-radius:12px;margin:4px}.muted{color:#c3d5e8}.big{font-size:2em}</style><main><header><h1>🌎 Ladina-Ameerika muusikalahing</h1><p>8. klass · 45 minutit · Samba · Salsa · Tango</p></header><section id="stage"></section><section><h3>🏆 Võistkondade punktid</h3><div id="scores"></div></section><button onclick="prev()">⬅ Eelmine</button><button onclick="next()">Järgmine ➡</button></main><script>
const stages=[
{title:"1. Kas rütm ilma meloodiata on muusika? (0–5 min)",body:"Vali seisukoht: JAH, EI või OLENEB. Põhjenda ühe lausega. Õpetaja mängib kätega lühikese rütmi. Mis teeb helidest muusika?",answer:"Rütm, kordus, pulss ja struktuur võivad luua muusikat ka ilma meloodiata."},
{title:"2. Ehita samba rütm (5–12 min)",body:"Kolm rühma: ① koputa lauale löökidel 1,3,5,7; ② plaksuta löökidel 2,4,6,8; ③ tee vaikne sõrmekoputus igal löögil. Alusta ühest kihist ja lisa ülejäänud. Korda neli korda.",answer:"Samba on Brasiilia muusikastiil. Selle löökpillimuusikas kõlavad koos eri rütmikihid. Meie harjutus on lihtsustatud."},
{title:"3. Salsa ja tango detektiivid (12–20 min)",body:"Kuula kaht näidet. A: Celia Cruz – La vida es un carnaval. B: Astor Piazzolla – Libertango. Millises kuuleb rohkem puhkpille? Milline kõlab dramaatilisemalt? Millises on bandoneon?",links:[["▶ Salsa kuulamine","https://www.youtube.com/results?search_query=Celia+Cruz+La+vida+es+un+carnaval"],["▶ Tango kuulamine","https://www.youtube.com/results?search_query=Astor+Piazzolla+Libertango"]],answer:"Salsas on sageli kongad, klaver ja vaskpuhkpillid. Tango seostub Argentina ja Uruguayga ning bandoneoniga. Küsimuste oodatavad vastused: puhkpillid A; dramaatilisem B; bandoneon B."},
{title:"4. Rütmisabotaaž (20–28 min)",body:"Jäta meelde ja esita: PLAKS – KOPUTUS – PLAKS – KOPUTUS | PLAKS – KOPUTUS – PLAKS – KOPUTUS. Õpetaja muudab salaja üht lööki. Mis muutus? Seejärel looge oma kaheksalöögiline rütm.",answer:"Näiteks asenda neljas koputus pausiga. Rütmimustris võib üks väike muutus muuta kogu kõlapilti."},
{title:"5. Muusikaviktoriin (28–39 min)",quiz:true},
{title:"6. Lõpumissioon (39–45 min)",body:"Vasta iseseisvalt: ① Nimeta üks Ladina-Ameerika muusikastiil ja selle maa või piirkond. ② Nimeta üks selle stiiliga seotud pill. ③ Kirjelda üht tunnis kuuldud või mängitud muusikalist tunnust.",answer:"Näidis: Samba on seotud Brasiiliaga. Surdo on suur trumm. Samba löökpillid mängivad üksteisega põimuvaid rütme."}
];
const questions=[
["Milliste riikidega seostub tango tekkimine?",["Brasiilia ja Mehhiko","Argentina ja Uruguay","Kuuba ja Colombia"],1,"Tango kujunes Río de la Plata piirkonnas."],
["Mis on sünkoop?",["Rõhk ootamatul löögil või löögiosal","Väga aeglane mängimine","Ühe noodi kordamine"],0,"Sünkoop nihutab rõhu tavapäraselt tugevalt löögilt mujale."],
["Milline pill on sambaansamblis tähtis?",["Surdo","Torupill","Klavessiin"],0,"Surdo on sügava kõlaga suur trumm."],
["Mis on bandoneon?",["Trompet","Lõõtsaga vabakeelpill","Puutrumm"],1,"Bandoneon on tango iseloomulik pill."],
["Milline stiil kujunes New Yorgis tugeva Kariibi mere mõjuga?",["Salsa","Valss","Polka"],0,"Salsa kujunes afrokuuba ja Kariibi muusikatraditsioonide toel."],
["Mis on clave-rütm?",["Korduv rütmiline alusmuster","Klaveriliik","Tantsukostüüm"],0,"Clave aitab korraldada afrokuuba muusika rütme."],
["Miks kõlab mitme löökpilli koosmäng keerukamalt?",["Kõik mängivad alati sama","Erinevad rütmikihid põimuvad","Trummid lähevad ise kiiremaks"],1,"Erinevad rütmid loovad koos mitmekihilise tekstuuri."],
["Millist pilli kasutatakse sageli salsas?",["Kongad","Torupill","Ainult orel"],0,"Kongad on salsas levinud löökpillid."],
["Mis on ostinato?",["Korduv muusikaline muster","Äkiline vaikus","Tantsuking"],0,"Ostinato on korduv rütmi- või meloodiamuster."],
["Miks on rütm tantsumuusikas tähtis?",["Aitab liikumist koordineerida","Muudab pillid tarbetuks","Muudab kõik lood ühesuguseks"],0,"Pulss ja rõhud aitavad tantsijatel liikumist ajastada."]
];let index=0,q=0,reveal=false,selected=-1,points=[0,0,0];function render(){let s=stages[index],h='<h2>'+s.title+'</h2>';if(s.quiz){let a=questions[q];h+='<p class="muted">Küsimus '+(q+1)+' / '+questions.length+'</p><h2>'+a[0]+'</h2><div class="answers">'+a[1].map((x,i)=>'<button onclick="selected='+i+';render()">'+(selected===i?'🔵 ':'')+'ABC'[i]+'. '+x+(reveal&&i===a[2]?' ✓':'')+'</button>').join('')+'</div>';if(reveal)h+='<p>✅ '+a[3]+'</p>';h+='<button onclick="reveal=!reveal;render()">Näita / peida vastus</button><button onclick="q=Math.max(0,q-1);reveal=false;selected=-1;render()">⬅ Küsimus</button><button onclick="q=(q+1)%questions.length;reveal=false;selected=-1;render()">Järgmine küsimus ➡</button>'}else{h+='<p class="big">'+s.body+'</p>';if(s.links)h+=s.links.map(x=>'<a target="_blank" rel="noopener" href="'+x[1]+'">'+x[0]+'</a>').join('');h+='<p><button onclick="reveal=!reveal;render()">💡 Näita / peida selgitus</button></p>';if(reveal)h+='<p>✅ '+s.answer+'</p>'}document.getElementById('stage').innerHTML=h;document.getElementById('scores').innerHTML=points.map((p,i)=>'<span class="score">Rühm '+(i+1)+': <b>'+p+'</b> <button onclick="change('+i+',1)">+</button><button onclick="change('+i+',-1)">−</button></span>').join('')}function change(i,d){points[i]=Math.max(0,points[i]+d);render()}function next(){index=Math.min(stages.length-1,index+1);reveal=false;render()}function prev(){index=Math.max(0,index-1);reveal=false;render()}render();
</script></html>
